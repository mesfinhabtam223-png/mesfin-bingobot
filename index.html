
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESFIN BINGO</title>
<style>
body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  background: #171717;
  padding: 25px;
  color: gold;
  font-size: 28px;
  font-weight: bold;
}
main { padding: 20px; }
button {
  background: gold;
  color: black;
  border: 0;
  padding: 14px 25px;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
}
table {
  margin: 25px auto;
  border-collapse: collapse;
}
td, th {
  border: 2px solid gold;
  width: 52px;
  height: 48px;
  font-size: 18px;
}
th { color: gold; }
.free { color: gold; }
</style>
</head>
<body>

<header>👑 MESFIN BINGO</header>

<main>
<h2>እንኳን ደህና መጡ!</h2>
<h3>Welcome to MESFIN BINGO</h3>

<p>የነፃ Bingo ጨዋታዎን ይጀምሩ</p>

<button onclick="makeCard()">CREATE MY CARD</button>

<div id="card"></div>

</main>

<script>
function makeCard() {
 const ranges = [
  [1,15],[16,30],[31,45],[46,60],[61,75]
 ];

 let cols = ranges.map(([a,b]) => {
  let nums = [];
  while(nums.length < 5) {
   let n = Math.floor(Math.random()*(b-a+1))+a;
   if(!nums.includes(n)) nums.push(n);
  }
  return nums;
 });

 cols[2][2] = "FREE";

 let html = "<table><tr>";
 ["B","I","N","G","O"].forEach(x => {
  html += "<th>"+x+"</th>";
 });
 html += "</tr>";

 for(let r=0;r<5;r++) {
  html += "<tr>";
  for(let c=0;c<5;c++) {
   html += "<td class='"+(cols[c][r]==="FREE"?"free":"")+"'>"+cols[c][r]+"</td>";
  }
  html += "</tr>";
 }
 html += "</table>";

 document.getElementById("card").innerHTML = html;
}
</script>

</body>
</html>
